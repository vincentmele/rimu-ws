[[bin]]
name = "arena-h1"
path = "src/bin/arena-h1.rs"
required-features = ["arena-h1"]

[[bin]]
name = "arena-h2"
path = "src/bin/arena-h2.rs"
required-features = ["arena-h2"]

[[bin]]
name = "autobahn-client"
path = "src/bin/autobahn-client.rs"
required-features = ["autobahn-client"]

[[bin]]
name = "autobahn-client-concurrent"
path = "src/bin/autobahn-client-concurrent.rs"
required-features = ["autobahn-client-concurrent"]

[[bin]]
name = "autobahn-server"
path = "src/bin/autobahn-server.rs"
required-features = ["autobahn-server"]

[[bin]]
name = "autobahn-server-drain"
path = "src/bin/autobahn-server-drain.rs"
required-features = ["autobahn-server-drain"]

[[bin]]
name = "autobahn-server-uring"
path = "src/bin/autobahn-server-uring.rs"
required-features = ["autobahn-server-uring"]

[[bin]]
name = "boringssl"
path = "src/bin/boringssl.rs"
required-features = ["boringssl"]

[[bin]]
name = "boringssl-config"
path = "src/bin/boringssl-config.rs"
required-features = ["boringssl-config"]

[[bin]]
name = "ccadb"
path = "src/bin/ccadb.rs"
required-features = ["ccadb"]

[[bin]]
name = "h2load"
path = "src/bin/h2load.rs"
required-features = ["h2load"]

[[bin]]
name = "h2spec-high"
path = "src/bin/h2spec-high.rs"
required-features = ["h2spec-high"]

[[bin]]
name = "h2spec-low"
path = "src/bin/h2spec-low.rs"
required-features = ["h2spec-low"]

[[bin]]
name = "testssl"
path = "src/bin/testssl.rs"
required-features = ["testssl"]

[[bin]]
name = "x509-limbo"
path = "src/bin/x509-limbo.rs"
required-features = ["x509-limbo"]

[[bin]]
name = "soak-server-tokio"
path = "src/bin/soak-server-tokio.rs"
required-features = ["soak-server-tokio"]

[[bin]]
name = "soak-server-h2"
path = "src/bin/soak-server-h2.rs"
required-features = ["soak-server-h2"]

[[bin]]
name = "soak-server-uring"
path = "src/bin/soak-server-uring.rs"
required-features = ["soak-server-uring"]

[dependencies]
serde = { default-features = false, optional = true, version = "1.0" }
serde_json = { default-features = false, features = ["alloc"], optional = true, version = "1.0" }
tokio = { default-features = false, features = ["macros", "net", "rt-multi-thread"], optional = true, version = "1.0" }
brotli = { default-features = false, features = ["std"], optional = true, version = "9.1" }
libc = { default-features = false, optional = true, version = "0.2" }
zlib-rs = { default-features = false, features = ["rust-allocator"], optional = true, version = "0.6" }
rimu-ws = { default-features = false, features = ["optimizations-std"], path = "../wtx" }

# Test-only: the HTTP/3 client of the in-process tests of arena-h2 (`cargo build` does not compile it:
# resolver 3 keeps the features of dev-dependencies out of builds that are not tests)
[dev-dependencies]
rimu-ws = { default-features = false, features = ["_h3-loopback-client", "crypto-ring"], path = "../wtx" }

[features]
arena-h1 = ["brotli", "serde/derive", "serde_json/std", "zlib-rs", "rimu-ws/crypto-ring", "rimu-ws/http1-server-framework", "rimu-ws/io-uring", "rimu-ws/json-writer", "rimu-ws/serde", "rimu-ws/serde_json"]
arena-h2 = ["libc", "serde/derive", "serde_json/std", "rimu-ws/crypto-ring", "rimu-ws/http2-server-framework", "rimu-ws/http3-server-framework", "rimu-ws/io-uring", "rimu-ws/json-writer", "rimu-ws/macros", "rimu-ws/serde", "rimu-ws/serde_json"]
autobahn-client = ["tokio", "rimu-ws/tokio", "rimu-ws/web-socket", "rimu-ws/zlib-rs"]
autobahn-client-concurrent = ["tokio",  "rimu-ws/tokio", "rimu-ws/web-socket", "rimu-ws/zlib-rs"]
autobahn-server = ["tokio", "rimu-ws/tokio", "rimu-ws/web-socket-server-framework", "rimu-ws/zlib-rs"]
autobahn-server-drain = ["tokio", "rimu-ws/tokio", "rimu-ws/web-socket-server-framework", "rimu-ws/zlib-rs"]
autobahn-server-uring = ["rimu-ws/crypto-ring", "rimu-ws/io-uring", "rimu-ws/web-socket-server-framework", "rimu-ws/zlib-rs"]
soak-server-tokio = ["tokio", "rimu-ws/crypto-ring", "rimu-ws/tokio", "rimu-ws/web-socket-server-framework", "rimu-ws/zlib-rs"]
soak-server-h2 = ["rimu-ws/crypto-ring", "rimu-ws/http2-server-framework", "rimu-ws/io-uring", "rimu-ws/macros"]
soak-server-uring = ["rimu-ws/crypto-ring", "rimu-ws/io-uring", "rimu-ws/web-socket-server-framework", "rimu-ws/zlib-rs"]
boringssl = ["tokio", "rimu-ws/tls", "rimu-ws/tokio", "rimu-ws/_tracing-tree", "rimu-ws/x509"]
boringssl-config = ["serde/derive", "serde_json/std", "rimu-ws/hashbrown", "rimu-ws/serde"]
ccadb = ["tokio", "rimu-ws/ccadb", "rimu-ws/hashbrown", "rimu-ws/http2-client-pool", "rimu-ws/http2", "rimu-ws/tokio"]
h2load = ["rimu-ws/crypto-ring", "rimu-ws/http2-server-framework", "rimu-ws/io-uring", "rimu-ws/macros"]
h2spec-high = ["rimu-ws/crypto-ring", "rimu-ws/http2-server-framework", "rimu-ws/io-uring", "rimu-ws/macros"]
h2spec-low = ["rimu-ws/crypto-ring", "rimu-ws/http2-server-framework", "rimu-ws/io-uring", "rimu-ws/macros"]
testssl = ["tokio", "rimu-ws/http2-server-framework", "rimu-ws/tokio"]
x509-limbo = ["rimu-ws/serde", "serde/derive", "serde_json/std", "rimu-ws/x509"]

[package]
edition = "2024"
license = "MPL-2.0"
name = "rimu-ws-internal"
publish = false
version = "0.0.0"
