[build-dependencies]
pb-rs = { default-features = false, optional = true, version = "0.10" }

[dependencies]
quick-protobuf = { default-features = false, optional = true, version = "0.8" }
serde = { default-features = false, optional = true, version = "1.0" }
serde_json = { default-features = false, features = ["std"], optional = true, version = "1.0" }
tokio = { default-features = false, features = ["macros", "net", "rt-multi-thread"], optional = true, version = "1.0" }
rimu-ws = { default-features = false, features = ["optimizations-std"], path = "../wtx" }

[features]
database-client-postgres = ["postgres"]
database-client-postgres-batch = ["postgres"]
database-client-postgres-composite-type = ["postgres"]
database-client-postgres-enum = ["postgres"]
database-client-tests = ["postgres", "rimu-ws/database-tests"]
environment-variables = ["rimu-ws/macros"]
executor = ["rimu-ws/macros"]
grpc-client = ["grpc", "rimu-ws/grpc-client"]
grpc-server = ["grpc", "rimu-ws/grpc-server"]
http2-client = ["tokio", "rimu-ws/ccadb", "rimu-ws/crypto-ring", "rimu-ws/tokio","rimu-ws/http2"]
http2-client-pool = ["tokio", "rimu-ws/ccadb", "rimu-ws/crypto-ring", "rimu-ws/tokio", "rimu-ws/http2-client-pool"]
http2-server = ["tokio", "rimu-ws/crypto-ring", "rimu-ws/http2", "rimu-ws/tokio","rimu-ws/web-socket"]
http2-server-framework = ["serde", "serde_json", "tokio", "rimu-ws/crypto-ring", "rimu-ws/http2-server-framework", "rimu-ws/postgres-pool", "rimu-ws/secret", "rimu-ws/serde_json", "rimu-ws/tokio"]
http2-server-framework-cors = ["tokio", "rimu-ws/crypto-ring", "rimu-ws/http2-server-framework", "rimu-ws/tokio"]
http2-server-framework-form-data = ["tokio", "rimu-ws/crypto-ring", "rimu-ws/http2-server-framework", "rimu-ws/tokio"]
http2-server-framework-redirect = ["tokio", "rimu-ws/crypto-ring", "rimu-ws/http2-server-framework", "rimu-ws/tokio"]
http2-server-framework-session = ["serde", "serde_json", "tokio", "rimu-ws/argon2", "rimu-ws/crypto-ring", "rimu-ws/http2-server-framework", "rimu-ws/http-session", "rimu-ws/macros", "rimu-ws/postgres-pool", "rimu-ws/tokio"]
secret = ["rimu-ws/secret"]
tls-client = ["tokio", "rimu-ws/ccadb", "rimu-ws/crypto-ring", "rimu-ws/tls", "rimu-ws/tokio"]
tls-client-concurrent = ["tokio", "rimu-ws/ccadb", "rimu-ws/crypto-ring", "rimu-ws/tls", "rimu-ws/tokio"]
tls-context = ["rimu-ws/tls"]
tls-server = ["tokio", "rimu-ws/crypto-ring", "rimu-ws/tls", "rimu-ws/tokio"]
web-socket-client = ["tokio", "rimu-ws/crypto-ring", "rimu-ws/tokio", "rimu-ws/web-socket"]
web-socket-client-concurrent = ["tokio", "rimu-ws/crypto-ring", "rimu-ws/tokio", "rimu-ws/web-socket"]
web-socket-server = ["tokio", "rimu-ws/crypto-ring", "rimu-ws/tokio", "rimu-ws/web-socket"]
web-socket-server-framework = ["tokio", "rimu-ws/crypto-ring", "rimu-ws/tokio", "rimu-ws/web-socket-server-framework"]
x509 = ["rimu-ws/crypto-ring", "rimu-ws/x509"]

grpc = ["pb-rs", "quick-protobuf", "tokio", "rimu-ws/crypto-ring", "rimu-ws/quick-protobuf", "rimu-ws/tokio"]
postgres = ["tokio", "rimu-ws/postgres", "rimu-ws/tokio"]

[package]
edition = "2024"
name = "rimu-ws-examples"
publish = false
version = "0.0.0"

