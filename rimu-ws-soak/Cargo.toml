[package]
authors = ["Vincent Mele <vince@mele.law>"]
description = "Soak and abuse harness for rimu-ws WebSocket servers"
edition = "2024"
license = "Apache-2.0"
name = "rimu-ws-soak"
publish = false
repository = "https://github.com/vincentmele/rimu-ws"
version = "0.1.0"

[dependencies]
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
hdrhistogram = { version = "7", default-features = false }
libc = "0.2"
rand = "0.9"
rand_chacha = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1_smol = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }

# The QUIC/HTTP/3 scenarios (task 23). These belong to the harness only; rimu-ws never depends on
# them. `quinn`/`h3`/`h3-quinn` drive the library abusers; the RustCrypto crates below build the
# raw Initial packets of `quic::raw`, so the harness speaks QUIC through codecs of its own (ruling
# T23-b) and shares no bug with the server.
quinn = "0.11"
h3 = "0.0.8"
h3-quinn = "0.0.10"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
bytes = "1"
http = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
aes = "0.8"
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
