[package]
description = "Soak and abuse harness for rimu-ws WebSocket servers"
edition = "2024"
license = "Apache-2.0"
name = "rimu-ws-soak"
publish = false
version = "0.1.0"

[dependencies]
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
hdrhistogram = { version = "7", default-features = false }
libc = "0.2"
rand = "0.9"
rand_chacha = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1_smol = "1"
socket2 = { version = "0.5", features = ["all"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
